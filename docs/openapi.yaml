openapi: 3.1.0
info:
  title: EcommerceRAG browser API
  version: v1
  description: 'The only HTTP surface the browser may use. Permissions are decided by Go; Python never receives browser credentials.
    Error responses use {"code": "<code>", "message": "<safe text>", "cause": "<category>"}.
    cause is a coarse class (gRPC code name or Go type); it never carries SQL, DSNs, paths or credentials.'
servers:
- url: https://{host}:8443
  variables:
    host:
      default: shop.example.com
security:
- sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      summary: Liveness and schema readiness
      responses:
        '200':
          description: OK
        '503':
          description: Database unavailable
  /setup:
    get:
      security: []
      summary: One-time first-run page (loopback in development, otherwise token)
      parameters:
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Setup form
        '403':
          description: Setup locked
        '409':
          description: Expired token
          already completed: null
          or bootstrap missing: null
    post:
      security: []
      summary: Set the owner password (writes local_credential only)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                token:
                  type: string
      responses:
        '303':
          description: Redirect to /login
        '400':
          description: Password too short
        '409':
          description: Setup closed
  /v1/auth/session:
    get:
      security: []
      summary: Browser identity state
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  authenticated:
                    type: boolean
                  mode:
                    type: string
                    enum:
                    - disabled
                    - oidc
                    - local
                  csrf_token:
                    type: string
                  must_change_password:
                    type: boolean
  /v1/auth/login:
    post:
      security: []
      summary: Local username/password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session cookie issued
        '401':
          description: Invalid credentials
        '403':
          description: account_revoked
        '423':
          description: Account locked
        '429':
          description: Rate limited
  /v1/auth/logout:
    post:
      summary: Revoke the current session
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Logged out
  /v1/auth/password:
    post:
      summary: Change the current password (revokes all sessions)
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 256
      responses:
        '200':
          description: Changed; re-login required
        '401':
          description: Current password wrong or session expired
        '423':
          description: Locked after repeated failures
  /v1/session:
    get:
      summary: Workspace identity summary
      responses:
        '200':
          description: Identity summary
        '401':
          description: Session invalid
        '403':
          description: account_revoked or password_change_required
  /v1/conversations:
    get:
      summary: List staff conversations
      responses:
        '200':
          description: OK
    post:
      summary: Create a staff conversation
      responses:
        '200':
          description: OK
  /v1/conversations/{id}:
    get:
      summary: Conversation detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/conversations/{id}/turns:
    post:
      summary: Send a staff turn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/turns/{id}:
    get:
      summary: Turn state
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/turns/{id}/events:
    get:
      summary: Turn server-sent events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream
  /v1/turns/{id}/cancel:
    post:
      summary: Cancel a turn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Cancellation accepted
  /v1/turns/{id}/resume:
    post:
      summary: Resume an interrupted turn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/customer/session:
    post:
      summary: Create an anonymous customer session (visitor token)
      responses:
        '200':
          description: OK
    get:
      summary: GET /v1/customer/session
      responses:
        '200':
          description: OK
  /v1/customer/shops/{slug}:
    get:
      summary: Public shop profile
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/customer/conversations:
    post:
      summary: Start a customer conversation
      responses:
        '200':
          description: OK
    get:
      summary: GET /v1/customer/conversations
      responses:
        '200':
          description: OK
  /v1/customer/conversations/{id}:
    get:
      summary: Customer conversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/customer/conversations/{id}/messages:
    post:
      summary: Send a customer message
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /v1/customer/conversations/{id}/events:
    get:
      summary: Customer server-sent events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream
  /v1/support/queue:
    get:
      summary: Human handoff queue
      responses:
        '200':
          description: OK
  /admin/v1/session:
    get:
      summary: Admin role catalog and grants
      responses:
        '200':
          description: OK
  /admin/v1/overview:
    get:
      summary: Admin overview
      responses:
        '200':
          description: OK
  /admin/v1/access/accounts:
    get:
      summary: Accounts within the current scope
      responses:
        '200':
          description: OK
  /admin/v1/access/requests:
    get:
      summary: Permission request queue
      responses:
        '200':
          description: OK
    post:
      summary: Create a permission request
      responses:
        '201':
          description: Created
  /admin/v1/access/requests/{id}/decision:
    post:
      summary: Approve or reject a request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Decided
  /admin/v1/staff:
    post:
      summary: Create a staff account with a one-time password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - role
              - reason
              properties:
                username:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$
                role:
                  type: string
                  enum:
                  - merchant_admin
                  - knowledge_reviewer
                shop_ids:
                  type: array
                  items:
                    type: string
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '201':
          description: Account created; initial_password is returned once
        '400':
          description: role_not_grantable or invalid input
        '403':
          description: admin_scope_denied
        '409':
          description: username_exists
  /admin/v1/merchant/shops:
    get:
      summary: Shops in scope
      responses:
        '200':
          description: OK
  /admin/v1/merchant/reviews:
    get:
      summary: Versions awaiting review
      responses:
        '200':
          description: OK
  /admin/v1/merchant/gaps/export:
    post:
      summary: Export content gaps as JSONL
      description: Download mode returns the JSONL body; the default keeps the legacy local-file response.
      parameters:
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 7d
          - 30d
      - name: download
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: JSONL attachment when download=1, otherwise the legacy path/count object
          content:
            application/jsonl:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  count:
                    type: integer
        '400':
          description: invalid_range
        '403':
          description: admin_scope_denied
        '503':
          description: gaps_unavailable
  /admin/v1/access/audit:
    get:
      summary: GET /admin/v1/access/audit
      responses:
        '200':
          description: OK
  /admin/v1/access/grants/{id}/revoke:
    post:
      summary: POST /admin/v1/access/grants/{id}/revoke
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/agent-review:
    get:
      summary: GET /admin/v1/merchant/agent-review
      responses:
        '200':
          description: OK
    put:
      summary: PUT /admin/v1/merchant/agent-review
      responses:
        '200':
          description: OK
  /admin/v1/merchant/commands/{id}:
    get:
      summary: GET /admin/v1/merchant/commands/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/support/suggestions/{id}/adopt:
    post:
      summary: POST /v1/support/suggestions/{id}/adopt
      responses:
        '202':
          description: Knowledge draft queued for review
        '200':
          description: Already adopted (idempotent repeat)
        '403':
          description: suggestion_not_adoptable or role_forbidden
        '404':
          description: suggestion_not_found
        '503':
          description: adoption_unavailable
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
  /v1/catalog/skus:
    get:
      summary: GET /v1/catalog/skus
      responses:
        '200':
          description: Published product rows for the current shop
        '400':
          description: invalid_catalog_query
        '403':
          description: role_forbidden or admin_scope_denied
        '503':
          description: catalog_unavailable
      parameters:
      - {name: shop_id, in: query, schema: {type: string}}
      - {name: q, in: query, schema: {type: string}}
      - {name: category, in: query, schema: {type: string}}
      - {name: sku, in: query, schema: {type: string}}
      - {name: attribute_key, in: query, schema: {type: string}}
      - {name: attribute_value, in: query, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1}}
      - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
  /admin/v1/merchant/gaps:
    get:
      summary: GET /admin/v1/merchant/gaps
      responses:
        '200':
          description: OK
  /admin/v1/merchant/import/templates/{name}:
    get:
      summary: GET /admin/v1/merchant/import/templates/{name}
      responses:
        '200':
          description: OK
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/imports:
    post:
      summary: POST /admin/v1/merchant/imports
      responses:
        '202':
          description: Import batch staged
        '400':
          description: Invalid manifest, package or confirmation
        '403':
          description: admin_scope_denied or ingest_not_authorized
        '409':
          description: import_state_conflict, version_conflict or precheck_blocked
        '500':
          description: ingest_schema_incomplete
        '503':
          description: database_unavailable, precheck_unavailable or ingest_queue_failed
  /admin/v1/merchant/imports/{id}:
    get:
      summary: GET /admin/v1/merchant/imports/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/imports/{id}/confirm:
    post:
      summary: POST /admin/v1/merchant/imports/{id}/confirm
      responses:
        '202':
          description: Import batch confirmed and queued
        '400':
          description: confirmation_required
        '403':
          description: ingest_not_authorized
        '409':
          description: import_state_conflict, batch_already_confirming, precheck_blocked or version_conflict
        '500':
          description: ingest_schema_incomplete or confirm_settle_failed
        '503':
          description: database_unavailable or confirm_queue_failed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/imports/{id}/revoke:
    post:
      summary: POST /admin/v1/merchant/imports/{id}/revoke
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/ingestion:
    get:
      summary: GET /admin/v1/merchant/ingestion
      responses:
        '200':
          description: OK
  /admin/v1/merchant/ingestion/{id}:
    get:
      summary: GET /admin/v1/merchant/ingestion/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/ingestion/{id}/cancel:
    post:
      summary: POST /admin/v1/merchant/ingestion/{id}/cancel
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/ingestion/{id}/retry:
    post:
      summary: POST /admin/v1/merchant/ingestion/{id}/retry
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/outcomes:
    get:
      summary: GET /admin/v1/merchant/outcomes
      responses:
        '200':
          description: OK
  /admin/v1/merchant/report/handoff:
    get:
      summary: GET /admin/v1/merchant/report/handoff
      responses:
        '200':
          description: OK
  /admin/v1/merchant/reviews/{id}:
    get:
      summary: GET /admin/v1/merchant/reviews/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/shops/{id}/settings:
    post:
      summary: POST /admin/v1/merchant/shops/{id}/settings
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/sources:
    get:
      summary: GET /admin/v1/merchant/sources
      responses:
        '200':
          description: OK
  /admin/v1/merchant/sources/import:
    post:
      summary: POST /admin/v1/merchant/sources/import
      responses:
        '202':
          description: Package queued through the direct import path
        '400':
          description: Invalid manifest or package
        '403':
          description: admin_scope_denied or ingest_not_authorized
        '409':
          description: version_conflict
        '500':
          description: ingest_schema_incomplete
        '503':
          description: database_unavailable or ingest_queue_failed
  /admin/v1/merchant/usage:
    get:
      summary: GET /admin/v1/merchant/usage
      responses:
        '200':
          description: OK
  /admin/v1/merchant/versions:
    get:
      summary: GET /admin/v1/merchant/versions
      responses:
        '200':
          description: OK
  /admin/v1/merchant/versions/batch-approve:
    post:
      summary: POST /admin/v1/merchant/versions/batch-approve
      responses:
        '200':
          description: OK
  /admin/v1/merchant/versions/{id}/publish:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/publish
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/versions/{id}/review:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/review
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/versions/{id}/revoke:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/revoke
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/versions/{id}/rollback:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/rollback
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/versions/{id}/suggestion:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/suggestion
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/merchant/versions/{id}/validity:
    post:
      summary: POST /admin/v1/merchant/versions/{id}/validity
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/report:
    get:
      summary: GET /admin/v1/report
      responses:
        '200':
          description: OK
  /admin/v1/intel/observations:
    get:
      summary: GET /admin/v1/intel/observations
      responses:
        '200':
          description: OK
  /admin/v1/intel/watch-configs:
    get:
      summary: GET /admin/v1/intel/watch-configs
      responses:
        '200':
          description: OK
    post:
      summary: POST /admin/v1/intel/watch-configs
      responses:
        '201':
          description: Created
  /admin/v1/intel/watch-configs/{id}:
    patch:
      summary: PATCH /admin/v1/intel/watch-configs/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/inspections:
    get:
      summary: GET /admin/v1/inspections
      responses:
        '200':
          description: OK
  /admin/v1/inspections/run:
    post:
      summary: POST /admin/v1/inspections/run
      responses:
        '200':
          description: OK
  /admin/v1/inspections/{id}:
    get:
      summary: GET /admin/v1/inspections/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /admin/v1/inspections/{id}/status:
    post:
      summary: POST /admin/v1/inspections/{id}/status
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/customer/conversations/{id}/citations/{message}:
    get:
      summary: GET /v1/customer/conversations/{id}/citations/{message}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: message
        in: path
        required: true
        schema:
          type: string
  /v1/customer/conversations/{id}/handoff:
    post:
      summary: POST /v1/customer/conversations/{id}/handoff
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/support/conversations/{id}:
    get:
      summary: GET /v1/support/conversations/{id}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/support/conversations/{id}/events:
    get:
      summary: GET /v1/support/conversations/{id}/events
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/support/conversations/{id}/suggestions:
    post:
      summary: POST /v1/support/conversations/{id}/suggestions
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/support/conversations/{id}/{action}:
    post:
      summary: POST /v1/support/conversations/{id}/{action}
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
  /v1/support/suggestions:
    post:
      summary: POST /v1/support/suggestions
      responses:
        '200':
          description: OK
  /v1/support/suggestions/{id}/copy:
    post:
      summary: POST /v1/support/suggestions/{id}/copy
      responses:
        '200':
          description: OK
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ecr_v2_session
