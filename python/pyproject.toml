[project]
name = "ecommerce-rag"
version = "0.1.0"
description = "EcommerceRAG remote development foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "grpcio>=1.70,<2",
  "grpcio-health-checking>=1.70,<2",
  "grpcio-reflection>=1.70,<2",
  "langchain>=0.3,<1",
  "langgraph>=0.3,<1",
  "langgraph-checkpoint-postgres==3.0.5",
  "psycopg[binary,pool]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.34,<1",
]
[dependency-groups]
dev = ["grpcio-tools>=1.70,<2", "pytest>=8,<9", "ruff>=0.11,<1"]
cloud = ["oss2==2.19.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
