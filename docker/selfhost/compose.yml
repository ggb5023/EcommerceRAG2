name: ${ECR_PROJECT:-ecr-merchant}
x-python: &python
  build: {context: ../.., dockerfile: docker/selfhost/python.Dockerfile}
  image: ecommerce-rag-python:selfhost
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
services:
  postgres:
    image: pgvector/pgvector@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    secrets: [pg-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres -d postgres"], interval: 5s, timeout: 3s, retries: 30}
  # One-shot: superuser creates roles, databases and extensions.
  db-init:
    <<: *python
    user: "0:0"
    restart: "no"
    read_only: false
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    command: [/app/scripts/selfhost-db-init.py]
    volumes: ["${ECR_RUNTIME}/bootstrap:/run/bootstrap:ro"]
    depends_on: {postgres: {condition: service_healthy}}
  # One-shot: migrator applies the checksum migrations.
  migrate:
    <<: *python
    restart: "no"
    command: [/app/scripts/v2-migrate.py, --env, /run/migration/migration.env]
    volumes: ["${ECR_RUNTIME}/migration.env:/run/migration/migration.env:ro"]
    depends_on: {db-init: {condition: service_completed_successfully}}
  # One-shot: migrator creates tenant, shop and the owner skeleton.
  bootstrap:
    <<: *python
    restart: "no"
    command: [/app/scripts/selfhost-bootstrap.py]
    volumes: ["${ECR_RUNTIME}/bootstrap:/run/bootstrap:ro", "${ECR_RUNTIME}/gateway:/run/gateway", "${ECR_RUNTIME}/identity:/run/identity"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: [oidc]
    command: [start, --import-realm, --http-enabled=true, --http-relative-path=/identity, --proxy-headers=xforwarded, --health-enabled=true, --hostname-strict=true]
    env_file: ["${ECR_RUNTIME}/identity.env"]
    volumes: ["${ECR_RUNTIME}/identity:/opt/keycloak/data/import:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [private]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /identity/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r response <&3; [[ "$$response" == *" 200 "* ]]']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  gateway:
    build: {context: ../.., dockerfile: docker/selfhost/go.Dockerfile}
    image: ecommerce-rag-go:selfhost
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ["${ECR_RUNTIME}/gateway.env"]
    volumes: ["${ECR_RUNTIME}/gateway:/run/runtime:ro", "${ECR_RUNTIME}/web:/run/web:ro"]
    ports: ["${ECR_WEB_BIND:-127.0.0.1}:${ECR_HTTPS_PORT:-8443}:8443"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [private]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
      ai: {condition: service_healthy}
    healthcheck: {test: [CMD, /probe], interval: 5s, timeout: 3s, retries: 30}
  ai:
    <<: *python
    command: [-m, app.ai_process]
    env_file: ["${ECR_RUNTIME}/ai.env"]
    volumes: ["${ECR_RUNTIME}/ai:/run/runtime:ro", "${ECR_RUNTIME}/artifacts:/var/lib/ecr/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck: {test: [CMD, /app/.venv/bin/python, /app/scripts/selfhost-health.py, ai], interval: 5s, timeout: 3s, retries: 30}
  redis:
    image: redis@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: [cache]
    command: [redis-server, /run/redis/redis.conf]
    volumes: [redis-data:/data, "${ECR_RUNTIME:?run selfhost init}/redis:/run/redis:ro"]
    networks: [private]
    restart: unless-stopped
networks:
  private: {}
volumes:
  postgres-data: {}
  redis-data: {}
secrets:
  pg-password: {file: "${ECR_RUNTIME}/bootstrap/pg-password"}
