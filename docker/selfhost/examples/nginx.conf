# D2 front proxy: one merchant, one domain.
#
# Gateway side (decision 0026):
#   WEB_ROOT=                       (must be empty; D2 never runs the built-in edge)
#   HTTP_ADDR=127.0.0.1:8080        (plain HTTP must stay on loopback)
#   V2_CUSTOMER_PROXY_HOST=<proxy>  (trusted proxy for customer IP/protocol)
# D1 and D2 are mutually exclusive: WEB_ROOT set *and* this proxy configured is
# rejected at startup (validateDeploymentForm, D4).
#
# This file is an example, not a tested deployment. Replace the domain, paths and
# certificate locations before use.

server {
    listen 443 ssl;
    server_name shop.example.com;

    ssl_certificate     /etc/ecommerce-rag/web.crt;
    ssl_certificate_key /etc/ecommerce-rag/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/frontend;

    # R4-4: SPA fallback for client routes. API locations below win first.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # R4-4: /v1, /admin/v1 and /v1/customer are forwarded without a path
    # rewrite; proxy_pass has no URI component. /healthz is forwarded too so
    # load-balancer probes reach the gateway instead of the SPA fallback.
    location ~ ^/(?:v1|admin/v1|healthz)(?:/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # R4-2: this front proxy is the only layer that decides the protocol.
        # Do not place another proxy/edge in front of it.
        proxy_set_header X-Forwarded-Proto https;

        # R4-3: SSE must stream immediately; buffering hides events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }
}
