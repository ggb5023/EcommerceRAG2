syntax = "proto3";
package rag.v1;
option go_package = "github.com/ggb5023/EcommerceRAG/go/internal/pb/rag/v1;ragv1";

// Only Go's authenticated server may produce this context.
message RequestContext {
  string request_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  repeated string allowed_shop_ids = 4;
  bool all_shops = 5;
  string permission_revision = 6;
  string shop_id = 7;
  string role = 8;
  // Signed finite scope issued by Go. An empty document list grants nothing.
  repeated string allowed_document_ids = 9;
  bool enforce_document_scope = 10;
  string scope_signature = 11;
  int64 scope_expires_at = 12;
  int64 tenant_db_id = 13;
  int64 user_db_id = 14;
  // Optional v2 execution identity. These fields are signed with the scope
  // and are required when Python creates an ASKING/HITL checkpoint.
  string conversation_id = 15;
  string turn_id = 16;
  string execution_id = 17;
  // Bind administrative calls to an audience and an immutable command payload.
  string scope_audience = 18;
  string command_id = 19;
  string command_action = 20;
  string command_payload_sha256 = 21;
}
message Evidence {
  string id = 1;
  string content = 2;
  string source_type = 3;
  string source_ref = 4;
  string document_id = 5;
  string version_id = 6;
  int32 page_no = 7;
  int32 rank = 8;
  double raw_score = 9;
  string shop_id = 10;
  string disclosure_class = 11;
  bool customer_eligible = 12;
  string tenant_id = 13;
}
message Fact {
  string tool_name = 1;
  string value_json = 2;
  string observed_at = 3;
  bool is_mock = 4;
  // Required for get_order_status/get_logistics (order_id) and
  // get_stock/get_price (sku). Must match the corresponding value_json field.
  // Go resolves the resource from explicit user data and checks ownership;
  // an AI rewrite alone never authorizes a resource or a cached fact value.
  string resource_id = 5;
}
service RagService {
  rpc Understand(UnderstandRequest) returns (UnderstandResponse);
  rpc Search(SearchRequest) returns (stream SearchResponse);
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);
  // v2 stores only the minimal identity required to resume an ASKING/HITL turn.
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
  rpc ResumeCheckpoint(ResumeCheckpointRequest) returns (ResumeCheckpointResponse);
  rpc ReloadSyntheticIndex(ReloadSyntheticIndexRequest) returns (ReloadSyntheticIndexResponse);
}
message UnderstandRequest {
  RequestContext context = 1;
  string query = 2;
  // Untrusted conversation data from Go, filtered by current permission
  // revision. JSON messages with role/content; never an authorization grant.
  string history_summary = 3;
}
message UnderstandResponse {
  string rewritten_query = 1;
  string intent = 2;
  string information_source = 3;
  repeated string required_fact_tools = 4;
  string clarification = 5;
  repeated EntitySlot entities = 6;
  double confidence = 7;
  string reason = 8;
}
message EntitySlot { string name = 1; string value = 2; double confidence = 3; }
message SearchRequest {
  RequestContext context = 1;
  string query = 2;
  bool allow_external_search = 3;
  string response_purpose = 4;
}
message SearchResponse {
  string phase = 1;
  repeated Evidence evidence = 2;
  bool complete = 3;
  repeated string degraded_stages = 4;
  string request_id = 5;
  bool is_mock = 6;
  string error_code = 7;
}
message GenerateRequest {
  RequestContext context = 1;
  string query = 2;
  repeated Evidence evidence = 3;
  repeated Fact facts = 4;
  string response_purpose = 5;
  // Current-permission conversation data for reference resolution only.
  // At most six JSON role/content messages and 8192 UTF-8 bytes. History is
  // neither evidence nor permission; facts must be reread and authorized.
  string history_summary = 6;
}
message GenerateResponse {
  uint64 sequence = 1;
  oneof event {
    string delta = 2;
    Evidence citation = 3;
    string usage_json = 4;
    bool done = 5;
    string error_code = 6;
    bool is_mock = 7;
    bool can_copy = 8;
  }
}

message SaveCheckpointRequest {
  RequestContext context = 1;
  string pending_kind = 2;
}
message SaveCheckpointResponse {
  bool accepted = 1;
  string thread_id = 2;
  string pending_kind = 3;
  int64 expires_at = 4;
}
message ResumeCheckpointRequest {
  RequestContext context = 1;
  string pending_kind = 2;
}
message ResumeCheckpointResponse {
  bool accepted = 1;
  string thread_id = 2;
  string pending_kind = 3;
  int64 expires_at = 4;
}

message ReloadSyntheticIndexRequest {
  RequestContext context = 1;
  repeated SyntheticIndexChunk chunks = 2;
  repeated string replace_document_ids = 3;
  repeated string remove_document_ids = 4;
}
message SyntheticIndexChunk {
  string tenant_id = 1;
  string shop_id = 2;
  string document_id = 3;
  string version_id = 4;
  string chunk_id = 5;
  string title = 6;
  string heading_path = 7;
  string content = 8;
  string source_ref = 9;
  string disclosure_class = 10;
  string effective_from = 11;
  string effective_to = 12;
  string metadata_json = 13;
  int32 section_seq = 14;
  int32 chunk_index = 15;
}
message ReloadSyntheticIndexResponse { int32 accepted_chunks = 1; }

service IngestService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc ValidatePackage(ValidatePackageRequest) returns (ValidatePackageResponse);
  rpc ParsePackage(ParsePackageRequest) returns (ParsePackageResponse);
  // Internal synthetic-ingest cleanup after a database transaction rolls back.
  rpc DeleteArtifactBundle(DeleteArtifactBundleRequest) returns (DeleteArtifactBundleResponse);
  // Go authorizes commands; Python exclusively changes ingestion state.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc GetCommandResult(GetCommandResultRequest) returns (GetCommandResultResponse);
}
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_DONE = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  JOB_STATUS_AWAITING_REVIEW = 6;
}
enum IngestCommandAction {
  INGEST_COMMAND_ACTION_UNSPECIFIED = 0;
  INGEST_COMMAND_ACTION_REVIEW = 1;
  INGEST_COMMAND_ACTION_PUBLISH = 2;
  INGEST_COMMAND_ACTION_ROLLBACK = 3;
  INGEST_COMMAND_ACTION_REVOKE = 4;
  INGEST_COMMAND_ACTION_RETRY = 5;
  INGEST_COMMAND_ACTION_CANCEL = 6;
}
message ExecuteCommandRequest {
  RequestContext context = 1;
  string command_id = 2;
  IngestCommandAction action = 3;
  // Version id for version commands; job id for retry/cancel.
  string resource_id = 4;
  string expected_hash = 5;
  int64 expected_fencing_epoch = 6;
  string reason = 7;
  string review_decision = 8;
  string disclosure_class = 9;
  bool external_allowed = 10;
}
message IngestCommandResult {
  string command_id = 1;
  string resource_id = 2;
  string status = 3;
  string review_status = 4;
  string reviewed_hash = 5;
  int64 fencing_epoch = 6;
  bool idempotent = 7;
  string error_code = 8;
  string error_message = 9;
}
message ExecuteCommandResponse { IngestCommandResult result = 1; }
message GetCommandResultResponse { IngestCommandResult result = 1; }
message GetCommandResultRequest {
  RequestContext context = 1;
  string command_id = 2;
}
message SubmitRequest {
  RequestContext context = 1;
  string idempotency_key = 2;
  string source_id = 3;
  string object_key = 4;
  string pipeline_version = 5;
  // v2 package submission. Go supplies the already-authorized identity and
  // Python persists the package and creates the durable ingestion job.
  string manifest_yaml = 6;
  repeated PackageFile files = 7;
  string tenant_db_id = 8;
  string user_db_id = 9;
  string shop_id = 10;
}
message SubmitResponse {
  string job_id = 1;
  JobStatus status = 2;
  string manifest_sha256 = 3;
  string package_sha256 = 4;
  int32 item_count = 5;
}
message GetStatusRequest {
  RequestContext context = 1;
  string job_id = 2;
}
message GetStatusResponse {
  string job_id = 1;
  JobStatus status = 2;
  string stage = 3;
  // provider_<classification> is a terminal embedding failure, including
  // retryable transport errors. Only an authorized RETRY command requeues it.
  // Unknown classifications become provider_failed; no vendor messages persist.
  string error_code = 4;
}
message CancelRequest {
  RequestContext context = 1;
  string job_id = 2;
}
message CancelResponse {
  string job_id = 1;
  JobStatus status = 2;
}
message PackageFile { string path = 1; bytes content = 2; }
message ParsePackageRequest {
  string manifest_yaml = 1;
  repeated PackageFile files = 2;
  string tenant_id = 3;
  string shop_id = 4;
}
message ValidatePackageRequest {
  string manifest_yaml = 1;
  repeated PackageFile files = 2;
  string tenant_id = 3;
  string shop_id = 4;
}
message ValidatedPackageDocument {
  string document_id = 1;
  string title = 2;
  string format = 3;
  string path = 4;
  string source_hash = 5;
  string disclosure_class = 6;
  string effective_from = 7;
  string effective_to = 8;
  string version_id = 9;
}
message ValidatePackageResponse {
  string source_id = 1;
  string source_name = 2;
  string pipeline_version = 3;
  string manifest_sha256 = 4;
  repeated ValidatedPackageDocument documents = 5;
}
message ParsedChunk {
  int32 chunk_index = 1;
  int32 section_seq = 2;
  int32 section_chunk_index = 3;
  int32 char_start = 4;
  int32 char_end = 5;
  string title = 6;
  string heading_path = 7;
  string content = 8;
  int32 token_count = 9;
  string content_type = 10;
  string split_reason = 11;
  string chunk_hash = 12;
  string metadata_json = 13;
}
message ParsedDocument {
  string document_id = 1;
  string title = 2;
  string format = 3;
  string path = 4;
  string source_hash = 5;
  string disclosure_class = 6;
  bool external_allowed = 7;
  string effective_from = 8;
  string effective_to = 9;
  repeated ParsedChunk chunks = 10;
  ArtifactBundleReference artifact_bundle = 11;
}
message ArtifactRecord {
  string artifact_type = 1;
  string object_key = 2;
  string sha256 = 3;
  int64 size_bytes = 4;
  string content_type = 5;
}
message ArtifactBundleReference {
  string document_version_id = 1;
  string manifest_object_key = 2;
  string manifest_sha256 = 3;
  string artifact_set_sha256 = 4;
  repeated ArtifactRecord artifacts = 5;
  bool real_service_acceptance = 6;
}
message ParsePackageResponse {
  string source_id = 1;
  string source_name = 2;
  string pipeline_version = 3;
  string manifest_sha256 = 4;
  string dataset_sha256 = 5;
  repeated ParsedDocument documents = 6;
  string manifest_yaml = 7;
}
message DeleteArtifactBundleRequest {
  string tenant_id = 1;
  string shop_id = 2;
  ArtifactBundleReference artifact_bundle = 3;
}
message DeleteArtifactBundleResponse {
  bool complete = 1;
  string error_code = 2;
}
